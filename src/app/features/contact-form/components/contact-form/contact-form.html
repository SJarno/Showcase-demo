<section class="page-container">
    <h2>{{ title() }}</h2>
    <form [attr.aria-busy]="isSubmitting()">
        <fieldset [disabled]="isSubmitting()">
            <mat-form-field>
                <mat-label for="firstName">First name</mat-label>
                <input matInput type="text" id="firstName" [formField]="contactForm.firstName">
                @for (error of contactForm.firstName().errors(); track error) {
                <mat-error>
                    {{ error.message}}
                </mat-error>
                }
            </mat-form-field>
        </fieldset>
    </form>
    <div class="progress-bar">
        @if (isSubmitting()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        }
    </div>

    <mat-divider></mat-divider>
    <footer>
        <button matButton="filled" (click)="submitForm()" [disabled]="submitDisabled()">Submit</button>
    </footer>
</section>
